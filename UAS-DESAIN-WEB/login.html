<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Geprek Mbok Dewor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-800 to-stone-900 h-screen flex items-center justify-center px-4">

    <main class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-stone-900">Sistem Admin</h1>
            <p class="text-stone-500 text-sm mt-1">Masuk untuk mengelola data Geprek Mbok Dewor</p>
        </div>

        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-stone-700 mb-1">Email / Username</label>
                <input type="email" id="email" required placeholder="admin@mbokdewor.com" 
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent text-sm">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-stone-700 mb-1">Kata Sandi</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent text-sm">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow-md">
                Sign In
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-sm text-stone-500 hover:text-stone-800 transition">&larr; Kembali ke Landing Page</a>
        </div>
    </main>

</body>
</html>
