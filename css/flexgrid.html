<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Flexbox Grid</title>
  </head>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #ffffff;
    }

    .container {
      display: flex;
      gap: 20px;
      justify-content: space-between;
    }

    .flex {
      display: flex;
      text-align: center;
      gap: 5px;
      background-color: #f0f0f0;
      padding: 10px;
      box-shadow: 1px 2px 10px ;
      border-radius: 20px;
    }

    .box {
      background-color: #4caf50;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      margin: 5px;
      display: flex;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 100px 150px 100px;
      gap: 5px;
      background-color: #f0f0f0;
      padding: 10px;
      box-shadow: 1px 2px 10px ;
      border-radius: 20px;
    }

    .box1 {
      background-color: #e04742;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      margin: 5px;

    }

    .box2 {
        grid-column: span 2;
      background-color: #510171;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      margin: 5px;
    }

    .box3 {
        grid-row: span 2;
      background-color: #3671df;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      margin: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <body>
    <h1>Perbandingan CSS Flexbox dan CSS Grid</h1>
    <div class="container">
      <section class="flex">
        <h3>Flexbox:</h3>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
      </section>
      <h3>Grid:</h3>
      <section class="grid">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box2">3</div>
        <div class="box3">4</div>
        <div class="box1">5</div>
        <div class="box1">6</div>
      </section>
    </div>
  </body>
</html>
