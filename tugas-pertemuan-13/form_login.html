<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircleTim - Secure Login</title>
    <style>
        :root {
            --primary: #6366f1; /* Neon Indigo */
            --primary-glow: rgba(99, 102, 241, 0.5);
            --dark-bg: #0f172a; /* Slate 900 */
            --surface: rgba(30, 41, 59, 0.4); /* Transparan untuk Glassmorphism */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(99, 102, 241, 0.2);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background-color: var(--dark-bg); 
            color: var(--text-main); 
            line-height: 1.6; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }

        /* --- ANIMASI BACKGROUND & TECH ELEMENTS --- */
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.2; }
        }

        @keyframes cardPop {
            from { opacity: 0; transform: translateY(30px) scale(0.5); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Ornamen Lingkaran Teknologi di Latar Belakang */
        .tech-glow-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            z-index: -1;
            animation: pulseGlow 8s ease-in-out infinite;
        }

        .tech-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            bottom: -15%;
            right: -10%;
            z-index: -1;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        /* Overlay Grid Digital */
        .tech-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo { font-size: 1.6rem; font-weight: 800; color: #ffffff; letter-spacing: -0.05em; }
        .nav-logo span { color: var(--primary); }

        .back-link {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link:hover { color: #ffffff; transform: translateX(-3px); }

        /* --- FORM GLASSMORPHISM --- */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .login-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* --- INPUT FIELD TECH EFFX --- */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a5b4fc;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            background: rgba(15, 23, 42, 0.6);
            font-size: 1rem;
            color: #ffffff;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 1px var(--primary), 
                        0 0 15px var(--primary-glow);
        }

        /* --- BUTTON GLOW --- */
        .btn-submit {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            padding: 0.9rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 700;
            text-align: center;
            border: none;
            cursor: pointer;
            margin-top: 2rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            transition: var(--transition);
            font-size: 1rem;
            letter-spacing: 0.02em;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- DIGITAL ELEMENTS BACKGROUND -->
    <div class="tech-glow-1"></div>
    <div class="tech-glow-2"></div>
    <div class="tech-grid"></div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo">Circle<span>Tim.</span></div>
        <a href="index.html" class="back-link">← Return to Home</a>
    </nav>

    <!-- CENTERED LOGIN CORE -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Authentication</h2>
                <p>Enter your credentials to access the node cluster</p>
            </div>
            
            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="username">Identity / NIM</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g. 24010123" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Security Key</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-submit">Initialize Session</button>
            </form>
        </div>
    </div>

</body>
</html>
