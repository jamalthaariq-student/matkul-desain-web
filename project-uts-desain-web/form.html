<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form - Toko Prima</title>
    </head>
    <style>
        body {
            font-family: arial, sans-serif;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            padding: 0px 10px;
            display: flex;
            background-color: #eceaea;
        }
        nav {
            margin-left: 100px;
            margin-top: 15px;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 70px;
        }
        nav ul li a {
            text-decoration: none;
            color: black;
        }
        nav ul li a:hover {
            color: blue;
        }
        main {
            margin-top: 20px;
        }
        form {
            background-color: #eceaea;
            padding: 30px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        fieldset {
            display: flex;
            flex-direction: column;
        }
        label,
        legend {
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type='text'],
        input[type='email'],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px;
            border-radius: 4px;
        }
        button {
            background-color: white;
            color: black;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 170px;
            font-weight: bold;
        }
        button:hover {
            background-color: green;
            color: white;
        }
    </style>
    <body>
        <header>
            <h1>Toko Prima</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="galery.html">Galeri</a></li>
                    <li><a href="form.html">Pesan</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Formulir Pemesanan</h2>
            <form action="#">
                <fieldset>
                    <label for="nama">Nama:</label>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Tuliskan nama lengkap"
                        required
                    />
                </fieldset>

                <fieldset>
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="contoh123@gmail.com"
                        required
                    />
                </fieldset>

                <fieldset>
                    <legend>Jenis Kelamin:</legend>
                    <nav>
                        <input
                            type="radio"
                            id="laki"
                            name="jk"
                            value="Laki-laki"
                        />
                        <label for="laki">Laki-laki</label>

                        <input
                            type="radio"
                            id="perempuan"
                            name="jk"
                            value="Perempuan"
                        />
                        <label for="perempuan">Perempuan</label>
                    </nav>
                </fieldset>

                <fieldset>
                    <label for="pesan">Pesanan:</label>
                    <textarea
                        id="pesan"
                        name="pesan"
                        rows="5"
                        required
                        placeholder="Tuliskan nama bahan atau merek yang anda cari"
                    ></textarea>
                </fieldset>

                <fieldset>
                    <label for="referensi"
                        >Upload referensi bahan (jika ada):</label
                    >
                    <input type="file" id="file" name="file" accept="image/*" />
                </fieldset>

                <button type="submit">Kirim Permintaan</button>
            </form>
        </main>
    </body>
</html>
